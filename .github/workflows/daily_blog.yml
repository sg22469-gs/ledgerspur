name: LedgerSpur Autonomous Multi-Slot Publisher

on:
  schedule:
    # Slot 1 & 2: Daily 2 Regular Flagship Posts (08:00 AM EST & 06:00 PM EST / 13:00 UTC & 23:00 UTC)
    - cron: '0 13,23 * * *'
    # Slot 3: Golden-Time Trending Post Segment (Alternate Days: Mon, Wed, Fri at 01:00 PM EST / 18:00 UTC)
    - cron: '0 18 * * 1,3,5'
  workflow_dispatch:
    inputs:
      segment:
        description: 'Publishing Segment'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - regular
          - trending
          - mock-audit
          - replenish

permissions:
  contents: write

jobs:
  publish-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Check Environment & Secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "[!] ERROR: GEMINI_API_KEY secret is MISSING in this GitHub repository!"
            echo "[!] Please add your Gemini API Key at: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          else
            echo "[✓] GEMINI_API_KEY secret detected."
          fi

      - name: Pre-Publish Topic Buffer & 48h Mock Audit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py --replenish
          python main.py --mock-audit

      - name: Generate & Publish Finance Article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash
          SITE_NAME: LedgerSpur
          SITE_URL: https://ledgerspur.com
          EVENT_CRON: ${{ github.event.schedule }}
          INPUT_SEGMENT: ${{ github.event.inputs.segment }}
        run: |
          if [ "$INPUT_SEGMENT" = "trending" ] || [ "$EVENT_CRON" = "0 18 * * 1,3,5" ]; then
            echo "[*] Executing Golden-Time Trending Post Segment..."
            python main.py --trending
          elif [ "$INPUT_SEGMENT" = "mock-audit" ]; then
            echo "[*] Mock audit finished."
          elif [ "$INPUT_SEGMENT" = "replenish" ]; then
            echo "[*] Buffer replenishment finished."
          else
            echo "[+] Executing Regular Daily Post Slot..."
            python main.py --run-once
          fi

      - name: Commit and Push Static Site Updates
        run: |
          git config --global user.name "LedgerSpur Bot"
          git config --global user.email "bot@ledgerspur.com"
          git add .
          git commit -m "Auto: Published finance guide & updated topics buffer" || exit 0
          git pull --rebase origin main
          git push origin main
